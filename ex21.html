<!DOCTYPE html>
<html lang="en">

<body>
    <script>
function somaDosQuadrados(A, B) {
    var A = parseInt(prompt("digite o valor de A"));
    var B = parseInt(prompt("digite o valor de B"));
    
    var resultado = (A*A) + (B*B);
    document.write("o valor do resultado de A e B é:" + resultado);
}

somaDosQuadrados(2,3);
</script>
</body>
