<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
function divisaoInteira(int1, int2) {
    var quociente = Math.floor(int1 / int2);
    var resto = int1 % int2;

    document.write("Quociente = " + quociente + "<br>");
    document.write("Resto = " + resto + "<br>");
}

divisaoInteira(10,3);
</script>
</body>
</html>
