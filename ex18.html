<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    function calcularVolume(){
    var comprimento= parseFloat(prompt("digite o comprimento"));
    var largura =  parseFloat(prompt("digite a largura"));
    var altura = parseFloat(prompt("digite a altura"));
     var volume = comprimento * largura * altura;
     document.write("comprimento:"+ comprimento + "<br>");
     document.write("largura:" + largura + "<br>");
     document.write("altura:" + altura + "<br>");
     document.write("volume de caixa:" + volume);
    }

    calcularVolume();






    </script>
</body>
</html>
