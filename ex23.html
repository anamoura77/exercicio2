<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
function inverterValores(numA, numB) {
    var numA = parseInt(prompt("digite o valor de numA:"));
    var numB = parseInt(prompt("digite o valor de numB"));
    var c = numA;
    numA = numB;
    numB = c;
    document.write("o novo valor de numA: " + numA + "<br>");
    document.write("o novo valor de numB:" + numB + "<br>");
}

inverterValores(5,9);
</script>
</body>
