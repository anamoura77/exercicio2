<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
   function operacoesQuatroNumeros(A, B, C, D) {
   var A = parseInt(prompt("digite o valor de A"));
   var B = parseInt(prompt ("digite o valor de B"));
   var C = parseInt(prompt("digite o valor de C"));
   var D = parseInt(prompt("digite o valor de D"));
   
   
   
    document.write("Somas:<br>");
    document.write("A+B = " + (A+B) + "<br>");
    document.write("A+C = " + (A+C) + "<br>");
    document.write("A+D = " + (A+D) + "<br>");
    document.write("B+C = " + (B+C) + "<br>");
    document.write("B+D = " + (B+D) + "<br>");
    document.write("C+D = " + (C+D) + "<br><br>");

    document.write("Multiplicações:<br>");
    document.write("A*B = " + (A*B) + "<br>");
    document.write("A*C = " + (A*C) + "<br>");
    document.write("A*D = " + (A*D) + "<br>");
    document.write("B*C = " + (B*C) + "<br>");
    document.write("B*D = " + (B*D) + "<br>");
    document.write("C*D = " + (C*D) + "<br>");
}

// Exemplo
operacoesQuatroNumeros(2,3,4,5);
</script>
</body>
</html>
